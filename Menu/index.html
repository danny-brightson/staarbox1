<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://app.staarbox.in https://staging-api.200-97-162-248.sslip.io; img-src 'self' data: https://app.staarbox.in https://staging-api.200-97-162-248.sslip.io; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Select Product</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../Css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../Css/shop.css">

  <style>
    body { background: #f6f8fa; }

    /* Section wrapper */
    .category-section { padding: 16px 16px 32px; display: flex; justify-content: center; }

    /* Grid - mobile first */
    .category-grid { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1fr; gap: 20px; }
    .shelf-intro { grid-column: 1 / -1; text-align: center; color: #4a7365; margin: 0; }

    /* The card */
    .category-card {
      background: #fff; border-radius: 20px; padding: 22px; text-align: center; position: relative;
      box-shadow: 0 10px 26px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 8px;
    }
    .category-card img {
      width: 100%; max-width: 200px; height: 200px; object-fit: contain; margin: 0 auto 8px;
      padding: 12px; border-radius: 18px;
    }
    .category-card.off { opacity: .55; }
    .card-badge { align-self: center; font-size: 12px; font-weight: 700; color: #02614e; background: #e7f3ef; border-radius: 999px; padding: 3px 12px; }
    .card-name { font-size: 1.05rem; font-weight: 700; color: #1d2939; line-height: 1.35; margin: 0; }
    .card-specs { list-style: none; padding: 0; margin: 0; color: #4a7365; font-size: 14px; }
    .menu-price { font-weight: 800; color: #02614e; font-size: 1.1rem; }
    .card-off { margin: 0; font-weight: 600; color: #667085; }
    .card-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .btn-buy, .btn-sample { display: block; border-radius: 999px; padding: 10px 14px; font-weight: 700; text-decoration: none; }
    .btn-buy { background: #02614e; color: #fff; }
    .btn-buy:hover { background: #014a3b; color: #fff; }
    .btn-sample { border: 2px solid #02614e; color: #02614e; }

    /* The category pills (the old customer pills) */
    .sticky-header { position: sticky; top: 0; z-index: 100; background: #f6f8fa; padding: 12px 0 8px; }
    .customer-pill-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .customer-pill { padding: 10px 22px; border-radius: 999px; border: 1px solid #d0d5dd; background: #fff; font-weight: 600; cursor: pointer; transition: .25s; }
    .customer-pill.active { background: #02614e; color: #fff; border-color: #02614e; box-shadow: 0 0 0 4px rgba(2, 97, 78, .15); }

    @media (min-width: 576px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 992px) {
      .category-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
      .category-card img { height: 160px; max-width: 160px; }
    }
  </style>

  <script type="module" src="../JS/site.js"></script>
  <script type="module" src="../JS/menu.js"></script>
</head>

<body>
  <main class="container shop-page" id="main">
    <h1 class="text-center fw-bold mt-4">Select Product</h1>
    <p class="text-center"><a href="../">Home</a></p>
    <div id="banner"></div>

    <div class="sticky-header">
      <div class="customer-pill-bar" id="tabs"></div>
    </div>

    <section class="category-section">
      <div class="category-grid" id="grid" aria-live="polite"></div>
    </section>
  </main>
</body>

</html>
