<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://checkout.razorpay.com; connect-src 'self' https://app.staarbox.in https://staging-api.200-97-162-248.sslip.io https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; img-src 'self' data: https://app.staarbox.in https://staging-api.200-97-162-248.sslip.io https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <title>Payment | Staarbox</title>

  <link rel="stylesheet" href="../Css/index.css" />
  <link rel="stylesheet" href="../Css/bootstrap.min.css" />
  <link rel="stylesheet" href="../Css/fontawesome.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../Css/googlefonts.css" />
  <link rel="stylesheet" href="../Css/Mdb.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Css/shop.css" />

  <style>
    :root { --bg: #f6f8fa; --card: #fff; --accent: #28a745; --muted: #6b7280; }
    body { font-family: Poppins, Inter, system-ui, Roboto, Arial; margin: 0; background: var(--bg); color: #111; }
    h1 { text-align: center; margin: 25px 0 10px; }
    .order-summary { background: var(--card); padding: 18px; border-radius: 12px; border: 1px solid rgba(0, 0, 0, 0.04); max-width: 640px; margin: 12px auto 28px; }
    .order-summary h2 { font-size: 20px; margin: 0 0 8px; }
    .order-summary h3 { font-size: 16px; margin: 16px 0 6px; }
    .summary-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed #eee; }
    .summary-item.total { border-bottom: 0; font-weight: 700; }
    .summary-item .minus { color: #067647; }
    .product-head { display: flex; gap: 14px; align-items: center; }
    .product-head img { width: 96px; height: 96px; object-fit: contain; border-radius: 12px; background: #f6f8fa; flex: none; }
    .product-head .badge-line { font-size: 12px; font-weight: 700; color: #02614e; }
    .product-head .name { font-size: 18px; font-weight: 700; margin: 2px 0; }
    .choice { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .choice label { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; }
    .choice input { flex: none; }
    .inside summary { cursor: pointer; font-weight: 600; margin-top: 12px; }
    .inside ul { margin: 6px 0 0; padding-inline-start: 18px; }
    .inside small { display: block; color: var(--muted); }
    .coins { margin-top: 10px; font-size: 14px; }
    .coins label { display: flex; gap: 8px; align-items: flex-start; }
    .muted { color: var(--muted); font-size: 13px; }
    .pay-btn { width: 100%; margin-top: 12px; padding: 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
    .pay-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
    .test-pay { margin-top: 12px; padding: 12px; border: 2px dashed #f79009; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
    .test-pay p { margin: 0; font-weight: 600; }
  </style>

  <script type="module" src="../JS/site.js"></script>
  <script type="module" src="../JS/pay.js"></script>
</head>

<body>
  <header>
    <nav class="navbar container-fluid" id="home">
      <div class="logo">
        <a href="../"><img src="../Image/staarbox.png" height="60" width="100" alt="StaarBox"></a>
      </div>
      <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
      <div class="nav-links" id="navLinks">
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../Menu/">Menu</a></li>
          <li><a href="../Contactus/">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="shop-page" id="main">
    <h1>Payment</h1>
    <div class="order-summary" aria-live="polite">
      <h2>Order Summary</h2>
      <div id="product"></div>
      <div id="whoFor"></div>
      <div id="mode"></div>
      <div id="inside"></div>
      <div id="note"></div>
      <div id="price"></div>
      <div id="payArea">
        <div id="payNotice"></div>
        <button id="payBtn" class="pay-btn" type="button" disabled>Proceed to Payment</button>
      </div>
    </div>
  </main>
</body>

</html>
