<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staarbox Kids veg Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

<style>
  :root{
    --green-950:#0e2a20;
    --green-900:#123626;
    --green-800:#1a4a34;
    --green-700:#20573d;
    --beige-200:#eee1c8;
    --sand:#faf6ee;
    --paper:#fdfbf6;
    --ink:#1c211d;
    --ink-soft:#5b6259;
    --line:#e6ddc9;
    --gold:#b98a3e;

    --kid-orange:#d98a50;
    --kid-yellow:#e3bd55;
    --kid-blue:#8fb8bf;

    --header-h:72px;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    color:var(--green-950);
    margin:0;
    font-weight:600;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}

  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:6px;
  }

  /* subtle decorative fruit-inspired shapes in the background */
  .deco-shape{
    position:absolute;
    border-radius:50%;
    filter:blur(0px);
    opacity:0.35;
    pointer-events:none;
    z-index:0;
  }
  .deco-shape.s1{ width:120px; height:120px; background:var(--kid-orange); top:90px; left:-40px; opacity:0.18; }
  .deco-shape.s2{ width:80px; height:80px; background:var(--kid-blue); top:420px; right:-30px; opacity:0.16; }
  .deco-shape.s3{ width:60px; height:60px; background:var(--kid-yellow); bottom:120px; left:6%; opacity:0.18; }

  /* ---------- HEADER ---------- */
  header.site-header{
    position:sticky;
    top:0;
    z-index:50;
    height:var(--header-h);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 clamp(16px,4vw,40px);
    background:rgba(250,246,238,0.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:600;
    color:var(--green-900);
    padding:8px 6px;
    border-radius:8px;
  }
  .back-link:hover{ color:var(--kid-orange); }
  .brand{
    font-family:'Fraunces',serif;
    font-size:20px;
    letter-spacing:0.08em;
    font-weight:700;
    color:var(--green-950);
  }
  .fav-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .fav-btn:hover{ transform:scale(1.08) rotate(-4deg); }
  .fav-btn svg{ width:20px; height:20px; }
  .fav-btn svg path{
    stroke:var(--green-900);
    fill:none;
    transition:fill .18s ease, stroke .18s ease;
  }
  .fav-btn.active{ background:#fbe9d9; border-color:var(--kid-orange); }
  .fav-btn.active svg path{ fill:var(--kid-orange); stroke:var(--kid-orange); }

  /* ---------- LAYOUT ---------- */
  main.product-layout{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:clamp(24px,3vw,56px);
    max-width:1320px;
    margin:0 auto;
    padding:clamp(20px,3vw,48px) clamp(16px,4vw,40px) 120px;
    align-items:start;
  }

  /* ---------- VIEWER ---------- */
  .viewer-col{
    position:sticky;
    top:calc(var(--header-h) + 20px);
  }
  .viewer-card{
    background:linear-gradient(180deg, var(--paper) 0%, var(--sand) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px;
    position:relative;
  }
  .viewer-card::before{
    content:"";
    position:absolute;
    top:-10px;
    right:22px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--kid-yellow);
    opacity:0.55;
  }
  #viewer{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:var(--radius-md);
    overflow:hidden;
    background:radial-gradient(circle at 50% 32%, #fffdf8 0%, #f6ecd8 55%, #eee0c4 100%);
  }
  #viewer canvas{ display:block; width:100% !important; height:100% !important; }

  .viewer-hint{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    font-size:12.5px;
    color:var(--ink-soft);
    background:rgba(253,251,246,0.88);
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .viewer-hint.hidden{ opacity:0; }

  .viewer-error{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .viewer-error.show{ display:flex; }

  .viewer-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .btn{
    border-radius:999px;
    padding:11px 20px;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--green-950);
    cursor:pointer;
    transition:transform .16s ease, background .16s ease, border-color .16s ease, opacity .16s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn:hover{ transform:translateY(-1px); border-color:var(--kid-orange); }
  .btn:active{ transform:translateY(0); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
  .btn-primary{
    background:var(--green-900);
    border-color:var(--green-900);
    color:var(--sand);
  }
  .btn-primary:hover{ background:var(--green-800); border-color:var(--green-800); }

  /* ---------- PRODUCT INFO ---------- */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--green-800);
    background:var(--beige-200);
    padding:6px 14px;
    border-radius:999px;
  }
  .badge::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--kid-orange);
    display:inline-block;
  }
  .product-title{
    font-size:clamp(28px,3vw,38px);
    margin-top:14px;
    line-height:1.15;
  }
  .rating-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .stars{ color:var(--gold); letter-spacing:1px; font-size:15px; }
  .rating-num{ color:var(--ink); font-weight:600; }

  .description{
    margin-top:18px;
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:52ch;
  }

  .stats-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:26px;
  }
  .stat-chip{
    display:inline-flex;
    align-items:center;
    gap:9px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 16px;
    background:var(--paper);
  }
  .stat-chip .icon{
    width:18px;
    height:18px;
    flex:0 0 auto;
    color:var(--kid-orange);
  }
  .stat-chip .icon svg{ width:100%; height:100%; }
  .stat-chip-text{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  .stat-chip-value{
    font-weight:600;
    font-size:13.5px;
    color:var(--green-950);
  }
  .stat-chip-label{
    font-size:11px;
    color:var(--ink-soft);
  }

  section.info-section{
    margin-top:40px;
  }
  .section-title{
    font-size:20px;
    margin-bottom:6px;
  }
  .section-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    max-width:56ch;
  }

  /* contents cards */
  .contents-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .content-card{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    background:var(--paper);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .content-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(20,30,20,0.06);
  }
  .content-card:nth-child(1){ border-top:3px solid var(--kid-orange); }
  .content-card:nth-child(2){ border-top:3px solid var(--kid-blue); }
  .content-card:nth-child(3){ border-top:3px solid var(--kid-yellow); }
  .content-card:nth-child(4){ border-top:3px solid var(--green-700); }
  .content-emoji{
    font-size:22px;
    line-height:1;
    flex:0 0 auto;
  }
  .content-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--green-950);
  }
  .contents-footnote{
    margin-top:14px;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* nutrition */
  .nutrition-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
    align-items:center;
  }
  .nutrition-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .nutrition-row{
    display:flex;
    justify-content:space-between;
    padding:10px 12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    font-size:13.5px;
  }
  .nutrition-row span:first-child{ color:var(--ink-soft); }
  .nutrition-row span:last-child{ font-weight:600; color:var(--green-950); }

  .donut-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .donut-legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 16px;
    justify-content:center;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .legend-dot{
    width:9px;
    height:9px;
    border-radius:50%;
  }

  /* essentials */
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--line);
    font-size:13.5px;
    font-weight:500;
    transition:transform .16s ease;
  }
  .chip:hover{ transform:translateY(-2px); }
  .essentials-note{
    margin-top:14px;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  /* price */
  .price-card{
    margin-top:40px;
    padding:22px;
    border-radius:var(--radius-lg);
    background:var(--green-950);
    color:var(--sand);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
    overflow:hidden;
  }
  .price-card::after{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:var(--kid-orange);
    opacity:0.15;
    top:-40px;
    right:-30px;
  }
  .price-value{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
  }
  .price-cadence{
    font-size:13px;
    color:#cfe0d5;
    margin-top:2px;
  }
  .price-card .btn-primary{
    background:var(--kid-orange);
    border-color:var(--kid-orange);
    color:var(--green-950);
    position:relative;
    z-index:1;
  }
  .price-card .btn-primary:hover{ background:#c97c3f; }

  /* mobile bottom bar */
  .mobile-bar{
    display:none;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:60;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:12px 16px;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 -6px 20px rgba(20,30,20,0.06);
  }
  .mobile-bar .price-value{ font-size:20px; color:var(--green-950); }
  .mobile-bar .price-cadence{ color:var(--ink-soft); font-size:11.5px; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:980px){
    body{ padding-bottom:78px; }
    main.product-layout{
      grid-template-columns:1fr;
      padding-bottom:24px;
    }
    .viewer-col{ position:static; }
    .price-card{ display:none; }
    .mobile-bar{ display:flex; }
    .nutrition-grid{ grid-template-columns:1fr; }
  }

  @media (max-width:520px){
    .brand{ font-size:16px; letter-spacing:0.06em; }
    .back-link span.back-text{ display:none; }
    .contents-grid{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>

  ],
  model3D: "../Image/Kid veg.glb"

/* =========================================================

========================================================= */
document.title = `${product.name} — Staarbox`;
document.getElementById("categoryBadge").textContent = product.category;

document.getElementById("ratingNum").textContent = product.rating.toFixed(1);
document.getElementById("productDescription").textContent = product.description;

const ICONS = {
  weight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M8 9h8l1.5 11.5a1 1 0 0 1-1 1.1H9.5a1 1 0 0 1-1-1.1L10 9z"/><circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"/></svg>`,
  protein: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4c-2 2-2 5 0 7l7 7c2 2 5 2 7 0s2-5 0-7l-7-7c-2-2-5-2-7 0z"/><path d="M9 9l6 6"/></svg>`,

/* ---- Donut chart (SVG, animated on view) ---- */
const donutSvg = document.getElementById("donutChart");
const donutLegend = document.getElementById("donutLegend");
const cx = 100, cy = 100, r = 72, strokeWidth = 24;
const circumference = 2 * Math.PI * r;

let cumulative = 0;
const arcs = [];
product.nutritionDistribution.forEach((seg) => {
  const dash = (seg.value / 100) * circumference;
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", cx);
  circle.setAttribute("cy", cy);
  circle.setAttribute("r", r);
  circle.setAttribute("fill", "none");
  circle.setAttribute("stroke", seg.color);
  circle.setAttribute("stroke-width", strokeWidth);
  circle.setAttribute("stroke-dasharray", `0 ${circumference}`);
  circle.setAttribute("stroke-dashoffset", -cumulative);
  circle.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
  circle.style.transition = "stroke-dasharray 1s ease";
  donutSvg.appendChild(circle);
  arcs.push({ circle, dash });
  cumulative += dash;

  const legendItem = document.createElement("div");
  legendItem.className = "legend-item";
  legendItem.innerHTML = `<span class="legend-dot" style="background:${seg.color}"></span>${seg.label} ${seg.value}%`;
  donutLegend.appendChild(legendItem);
});

const centerText = document.createElementNS("http://www.w3.org/2000/svg", "text");
centerText.setAttribute("x", cx);
centerText.setAttribute("y", cy + 6);
centerText.setAttribute("text-anchor", "middle");
centerText.setAttribute("font-family", "Fraunces, serif");
centerText.setAttribute("font-size", "18");
centerText.setAttribute("fill", "#0e2a20");
centerText.textContent = product.nutrition.calories;
donutSvg.appendChild(centerText);

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let donutAnimated = false;
function animateDonut(){
  if (donutAnimated) return;
  donutAnimated = true;
  if (prefersReducedMotion) {
    arcs.forEach(a => a.circle.setAttribute("stroke-dasharray", `${a.dash} ${circumference}`));
    return;
  }
  requestAnimationFrame(() => {
    arcs.forEach(a => a.circle.setAttribute("stroke-dasharray", `${a.dash} ${circumference}`));
  });
}
const donutObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) animateDonut(); });
}, { threshold: 0.4 });
donutObserver.observe(donutSvg);

/* =========================================================
   3D VIEWER
========================================================= */
const viewerEl = document.getElementById("viewer");
const viewerHint = document.getElementById("viewerHint");
const viewerError = document.getElementById("viewerError");
const resetBtn = document.getElementById("resetBtn");
const toggleLidBtn = document.getElementById("toggleLidBtn");

let scene, camera, renderer, controls, mixer, clock;
let modelRoot = null;
let lidObject = null;
let lidOriginalRotation = null;
let lidOpen = false;
let lidAnimating = false;
let initialCameraPos = null;
let initialTarget = null;

let isUserInteracting = false;
let idleTimer = null;
const AUTO_ROTATE_RESUME_MS = 1500;

function initViewer(){
  scene = new THREE.Scene();
  scene.background = null;

  camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(0, 1.4, 4.2);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  viewerEl.appendChild(renderer.domElement);

  // Lighting — warm, friendly, premium
  const ambient = new THREE.AmbientLight(0xfff4e0, 0.55);
  scene.add(ambient);

  const hemi = new THREE.HemisphereLight(0xfff8ea, 0x3a4a3a, 0.65);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xffffff, 1.4);
  key.position.set(3, 5, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 15;
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xffe9d2, 0.4);
  fill.position.set(-4, 2, -3);
  scene.add(fill);

  // Ground shadow catcher
  const groundGeo = new THREE.CircleGeometry(2.4, 48);
  const groundMat = new THREE.ShadowMaterial({ opacity: 0.16 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1.5;
  controls.maxDistance = 8;
  controls.maxPolarAngle = Math.PI * 0.92;
  controls.target.set(0, 0.6, 0);
  controls.autoRotate = !prefersReducedMotion;
  controls.autoRotateSpeed = 0.8;
  controls.update();

  controls.addEventListener("start", () => {
    isUserInteracting = true;
    controls.autoRotate = false;
    viewerHint.classList.add("hidden");
    clearTimeout(idleTimer);
  });
  controls.addEventListener("end", () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      isUserInteracting = false;
      if (!prefersReducedMotion) controls.autoRotate = true;
    }, AUTO_ROTATE_RESUME_MS);
  });

  clock = new THREE.Clock();
  resizeRenderer();
  window.addEventListener("resize", resizeRenderer);

  loadModel();
  animate();
}

function resizeRenderer(){
  const width = viewerEl.clientWidth;
  const height = viewerEl.clientHeight;
  if (!width || !height) return;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}

function loadModel(){
  const loader = new GLTFLoader();
  loader.load(
    MODEL_PATH,
    (gltf) => {
      modelRoot = gltf.scene;
      scene.add(modelRoot);

      // Auto center + scale
      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDimension = Math.max(size.x, size.y, size.z) || 1;
      const targetSize = 2.0;
      const scale = targetSize / maxDimension;
      modelRoot.scale.setScalar(scale);

      const scaledBox = new THREE.Box3().setFromObject(modelRoot);
      const scaledCenter = new THREE.Vector3();
      scaledBox.getCenter(scaledCenter);
      modelRoot.position.x -= scaledCenter.x;
      modelRoot.position.z -= scaledCenter.z;
      modelRoot.position.y -= scaledBox.min.y; // sit on ground

      modelRoot.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      // Position camera relative to final size
      const finalBox = new THREE.Box3().setFromObject(modelRoot);
      const finalSize = new THREE.Vector3();
      finalBox.getSize(finalSize);
      const finalCenter = new THREE.Vector3();
      finalBox.getCenter(finalCenter);

      controls.target.copy(finalCenter);
      const dist = Math.max(finalSize.x, finalSize.y, finalSize.z) * 2.4;
      camera.position.set(finalCenter.x + dist * 0.5, finalCenter.y + dist * 0.4, finalCenter.z + dist * 0.8);
      controls.update();

      initialCameraPos = camera.position.clone();
      initialTarget = controls.target.clone();

      // Find lid object by configured names
      lidObject = findLidObject(modelRoot);
      if (lidObject) {
        lidOriginalRotation = lidObject.rotation.clone();
        toggleLidBtn.disabled = false;
      } else {
        toggleLidBtn.disabled = true;
        toggleLidBtn.setAttribute("aria-label", "Open box unavailable for this model");
      }

      // Built-in animations support
      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(modelRoot);
      }
    },
    undefined,
    (error) => {
      console.error("Kids Box GLB failed to load:", error);
      viewerError.classList.add("show");
      viewerHint.classList.add("hidden");
      toggleLidBtn.disabled = true;
      resetBtn.disabled = true;
    }
  );
}

function findLidObject(root){
  let found = null;
  root.traverse((child) => {
    if (found) return;
    if (MODEL_CONFIG.lidNames.some(name => child.name === name || child.name?.toLowerCase() === name.toLowerCase())) {
      found = child;
    }
  });
  return found;
}

/* ---- Open/Close lid animation (manual tween) ---- */
function animateLid(open){
  if (!lidObject || lidAnimating) return;
  lidAnimating = true;

  const startRot = lidObject.rotation.x;
  const endRot = open ? lidOriginalRotation.x + MODEL_CONFIG.openRotationX : lidOriginalRotation.x;
  const duration = prefersReducedMotion ? 1 : MODEL_CONFIG.animationDuration;
  const startTime = performance.now();

  function step(now){
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    lidObject.rotation.x = startRot + (endRot - startRot) * eased;
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      lidAnimating = false;
      lidOpen = open;
      toggleLidBtn.textContent = lidOpen ? "Close Box" : "Open Box";
      toggleLidBtn.setAttribute("aria-label", lidOpen ? "Close box" : "Open box");
    }
  }
  requestAnimationFrame(step);
}

toggleLidBtn.addEventListener("click", () => {
  if (!lidObject) return;
  animateLid(!lidOpen);
});

resetBtn.addEventListener("click", () => {
  if (initialCameraPos && initialTarget) {
    camera.position.copy(initialCameraPos);
    controls.target.copy(initialTarget);
    controls.update();
  }
  if (lidObject) {
    lidObject.rotation.copy(lidOriginalRotation);
  }
  lidOpen = false;
  lidAnimating = false;
  toggleLidBtn.textContent = "Open Box";
  toggleLidBtn.setAttribute("aria-label", "Open box");
  viewerHint.classList.remove("hidden");
});

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  controls.update();
  renderer.render(scene, camera);
}

new ResizeObserver(() => resizeRenderer()).observe(viewerEl);

initViewer();
</script>
