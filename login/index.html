<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; connect-src 'self' https://app.staarbox.in https://staging-api.200-97-162-248.sslip.io https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://www.google.com https://recaptcha.google.com https://staarbox-91945.firebaseapp.com; img-src 'self' data: https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">

  <title>OTP Login | STAARBOX</title>

  <link rel="stylesheet" href="../Css/bootstrap.min.css">
  <link rel="stylesheet" href="../Css/shop.css">

  <style>
    :root {
      --brand: #02614e;
      --muted: #4a7365;
    }

    body{ margin:0; padding:16px; min-height:100vh;
      background: url('../Image/staarbox.png') center center/contain no-repeat,
                  linear-gradient(135deg,var(--brand), #eccfa1);
      background-blend-mode: overlay;
      display:flex; align-items:center; justify-content:center;
      font-family: "Poppins", sans-serif;
    }

    .otp-card { width:100%; max-width:460px; padding:32px; border-radius:18px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-align:center; color:var(--brand);
    }

    .brand { font-size:28px; font-weight:800; margin-bottom:6px; }
    h1 { margin-top:0; margin-bottom:6px; }

    .form-control { border-radius:12px; padding:12px; border:1px solid rgba(0,0,0,0.08);
      background: #fff; color:var(--brand);
    }
    .form-control::placeholder { color: #8aa79a; }

    .otp-card .btn { border-radius:12px; padding:12px; font-size:16px; width:100%; }

    #status { margin-top:12px; min-height:22px; font-weight:600; color:var(--muted); }

    .small-muted { color:var(--muted); font-size:0.92rem; }

    /* ---------- recaptcha animated wrapper ---------- */
    #recaptcha-wrapper { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.5s cubic-bezier(.2,.9,.2,1); margin-top: 10px; }
    #recaptcha-wrapper.show { max-height: 210px; opacity: 1; margin-bottom: 12px; }
    #recaptcha-container { width:100%; display:flex; justify-content:center; }

    /* inline country code + phone */
    .phone-row { display:flex; gap:8px; align-items:center; }
    .country-code { max-width:72px; text-align:center; font-weight:600; }
    .local-phone { flex:1; min-width:0; }

    .field-error { color:#b42318; font-size:0.85rem; min-height:1.1em; margin-top:4px; }
    .agree { margin-top:16px; margin-bottom:0; }
    .agree a { color:var(--brand); font-weight:600; }

    #consent { text-align:start; max-height:60vh; overflow:auto; }
    .legal-doc { margin-top:12px; }
    .legal-doc details { border-bottom:1px solid rgba(0,0,0,0.08); padding:6px 0; }
    .legal-doc summary { cursor:pointer; font-weight:600; }
    .legal-notice { font-weight:600; }
  </style>

  <script type="module" src="../JS/site.js"></script>
  <script type="module" src="../JS/login.js"></script>
</head>
<body>
  <main class="otp-card" id="main" aria-labelledby="loginTitle">
    <div class="brand">⭐ STAARBOX</div>
    <h1 class="h3" id="loginTitle">Welcome Back!</h1>
    <p class="small-muted" id="tagline">Fresh nutrition, delivered every morning.</p>

    <form id="phoneForm" novalidate>
      <div id="nameRow" class="mb-3 text-start" hidden>
        <label for="userName" class="small-muted">Full Name</label>
        <input id="userName" class="form-control mt-1" type="text" placeholder="Enter your full name" autocomplete="name" maxlength="50" />
        <div class="field-error" id="nameError" aria-live="polite"></div>
      </div>

      <div class="text-start">
        <label for="localPhone" class="small-muted">Mobile Number</label>
        <div class="phone-row mt-1">
          <span class="form-control country-code" aria-hidden="true">+91</span>
          <input id="localPhone" class="form-control local-phone" type="tel" inputmode="numeric" placeholder="e.g. 98765 43210" autocomplete="tel-national" maxlength="10" />
        </div>
        <div class="field-error" id="phoneError" aria-live="polite"></div>
      </div>

      <div id="referralRow" class="mt-2 text-start" hidden>
        <label for="referral" class="small-muted">Referral Code (Optional)</label>
        <input id="referral" class="form-control mt-1" type="text" placeholder="E.g. SBX7K2QPM" maxlength="9" autocomplete="off" />
        <div class="field-error" id="referralError" aria-live="polite"></div>
      </div>

      <!-- The reCAPTCHA box (live sign-in only) slides in when Get OTP is pressed. -->
      <div id="recaptcha-wrapper">
        <div id="recaptcha-container"></div>
      </div>

      <button id="sendOtpBtn" class="btn btn-warning mt-3 mb-2" type="submit">Get OTP</button>
      <p class="small-muted mb-0"><span id="switchText">New to STAARBOX?</span> <button type="button" id="switchMode" class="link-btn">Register Now</button></p>
    </form>

    <form id="otpForm" novalidate hidden>
      <h2 class="h5">Verify Your Number</h2>
      <p class="small-muted">We’ve sent a 6-digit OTP to <strong id="maskedPhone"></strong> <button type="button" id="editPhone" class="link-btn" aria-label="Edit mobile number" title="Edit mobile number">✎</button></p>
      <label for="otpInput" class="small-muted">Enter the 6-digit OTP</label>
      <input id="otpInput" class="form-control mb-3 mt-1" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
      <button id="verifyOtpBtn" class="btn btn-success mb-2" type="submit">Verify</button>
      <p class="small-muted mt-2 mb-0">Didn’t receive the OTP? <button type="button" id="resendOtp" class="link-btn">Resend OTP</button></p>
    </form>

    <section id="consent" aria-live="polite" hidden></section>

    <div id="status" class="small-muted" aria-live="polite"></div>

    <p class="small-muted agree" id="agree">By continuing you agree to our <a id="termsLink" href="#">Terms &amp; Conditions</a> and <a id="privacyLink" href="#">Privacy Policy</a></p>
  </main>
</body>
</html>
